plugins {
	id "com.vaadin" version "${vaadin_version}"
}

vaadin {
	// Keep Vaadin's npm workspace and frontend sources anchored to this module.
	// Runtime launches must use this module as their working directory as well.
	npmFolder = projectDir
	frontendDirectory = file("src/main/frontend")
}

dependencyManagement {
	imports {
		mavenBom "com.vaadin:vaadin-bom:${vaadin_version}"
	}
}

dependencies {
	implementation project(":rg-logic")

	implementation "com.vaadin:vaadin-spring-boot-starter"
	implementation "com.vaadin:vaadin-dev-server"
	implementation "org.springframework.boot:spring-boot-starter-data-jpa"
	implementation "org.springframework.boot:spring-boot-starter-json"
	implementation "org.springframework.boot:spring-boot-starter-security"
	implementation "vg.unique-id:unique-id-jpa-lib:${vg_unique_id_version}"
	implementation "com.oracle.cloud.spring:spring-cloud-oci-starter-vault:${spring_cloud_oci_version}"

	runtimeOnly "com.h2database:h2"
	runtimeOnly "org.springframework.boot:spring-boot-starter-liquibase"
	runtimeOnly "vg.identity:identity-rest-client:${vg_identity_version}"
//	runtimeOnly "vg.unique-id:unique-id-logic:${vg_unique_id_version}"
	runtimeOnly "vg.unique-id:unique-id-rest-client:${vg_unique_id_version}"
	runtimeOnly "com.mysql:mysql-connector-j"

	compileOnly "org.projectlombok:lombok"
	annotationProcessor "org.projectlombok:lombok"
	testImplementation "org.springframework.boot:spring-boot-starter-test"
	testImplementation "vg.identity:identity-rest-client:${vg_identity_version}"
}

tasks.named("test") {
	useJUnitPlatform()
}
