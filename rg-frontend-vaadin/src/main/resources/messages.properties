# Denial deliberately has NO workspace-specific message: an unentitled user is rerouted to the
# generic no-access / access-denied views. A message naming the workspace section would disclose that
# the section exists, which the gate is meant to prevent.

# Workspace lifecycle: rename and removal. Removal names its consequence outright, because it
# takes the workspace's contents with it and cannot be undone.
