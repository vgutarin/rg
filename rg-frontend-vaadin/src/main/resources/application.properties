spring.application.name=rg-frontend-vaadin
server.port=9000
# The app runs plain HTTP behind a TLS-terminating proxy/tunnel (required for Telegram Mini Apps,
# which only allow https URLs). Trust X-Forwarded-Proto/-Host so redirects and generated URLs keep
# the https scheme; otherwise a first-load redirect drops the webview to an http:// origin, which
# breaks secure-context features such as geolocation. Only enable behind a trusted proxy.
server.forward-headers-strategy=framework
#spring.jpa.properties.javax.persistence.schema-generation.scripts.action=create
#spring.jpa.properties.javax.persistence.schema-generation.scripts.create-target=create.sql

#server.servlet.context-path=/app

#spring.datasource.url=jdbc:h2:mem:testdb
#spring.datasource.driverClassName=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=password
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
#
#
#spring.h2.console.enabled=true

spring.jpa.open-in-view=false
# Database
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:liquibase-changelog.yml

# Names/placeholders are safe to commit; values come from runtime secrets.
vg.identity.rest-client.base-url=${VG_IDENTITY_REST_CLIENT_BASE_URL:http://localhost:8080}
vg.identity.rest-client.api-key=${VG_IDENTITY_REST_CLIENT_API_KEY:}
vg.identity.rest-client.connect-timeout=${VG_IDENTITY_REST_CLIENT_CONNECT_TIMEOUT:PT2S}
vg.identity.rest-client.read-timeout=${VG_IDENTITY_REST_CLIENT_READ_TIMEOUT:PT8S}

# RG-owned immutable startup limits for opaque input and parsed identity permissions.
rg.secure-service.max-init-data-size=${VG_RG_SECURE_SERVICE_MAX_INIT_DATA_SIZE:32KB}
rg.secure-service.identity.max-permission-count=${VG_RG_SECURE_SERVICE_IDENTITY_MAX_PERMISSION_COUNT:1024}
rg.secure-service.identity.max-permission-length=${VG_RG_SECURE_SERVICE_IDENTITY_MAX_PERMISSION_LENGTH:128}

# A raw-response limit and total request timeout remain release-blocked until the published
# identity-rest-client exposes and enforces those properties before response parsing.

# Locale fallback is deterministic and never depends on the host JVM locale.
spring.messages.fallback-to-system-locale=false

# Geolocation module. The Google Maps browser key is referrer-restricted and injected from the
# environment; the placeholder name is safe to commit, the value is not.
google.maps.browser-api-key=${GOOGLE_MAPS_BROWSER_API_KEY:}
# Proximity-suggestion radius in meters (default 500); configurable per environment.
rg.geo.match-radius-meters=${RG_GEO_MATCH_RADIUS_METERS:500}
# Maximum name-search results returned to the UI.
rg.geo.max-name-search-results=${RG_GEO_MAX_NAME_SEARCH_RESULTS:50}
