databaseChangeLog:

  - changeSet:
      id: 006-event-registration-1
      author: vg
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        # One participant registered to one event. A join row between an event and a participant, both of
        # which already carry the workspace; the owner's authority over it comes from owning that
        # workspace, resolved by joining through the event. The workspace is deliberately NOT duplicated
        # here -- unlike a direct child of the workspace (event, participant, location), a join row's
        # workspace is genuinely derivable, so storing it would be redundant.
        #
        # order_by is the participant's position within the event's roster; default is insertion order,
        # so the first registered stays on top.
        - createTable:
            tableName: rg_workspace_event_registration
            columns:
              - column:
                  name: unique_id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_rg_workspace_event_registration
              - column:
                  name: version
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: event_unique_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: participant_unique_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: order_by
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: author
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: last_editor
                  type: BIGINT
              - column:
                  name: created_at
                  type: DATETIME(8)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: DATETIME(8)
                  constraints:
                    nullable: false
        # Plain FKs with no onDelete, exactly like the event and participant tables. That restrictiveness
        # is load-bearing: a forgotten WorkspaceContentContributor -- or a delete that fails to unregister
        # first -- fails loudly instead of silently mass-deleting rows with no audit and no chance to
        # refuse.
        - addForeignKeyConstraint:
            constraintName: fk_rg_workspace_event_registration_event
            baseTableName: rg_workspace_event_registration
            baseColumnNames: event_unique_id
            referencedTableName: rg_workspace_event
            referencedColumnNames: unique_id
        - addForeignKeyConstraint:
            constraintName: fk_rg_workspace_event_registration_participant
            baseTableName: rg_workspace_event_registration
            baseColumnNames: participant_unique_id
            referencedTableName: rg_workspace_participant
            referencedColumnNames: unique_id
        # A participant is registered to an event at most once.
        - addUniqueConstraint:
            constraintName: uq_rg_workspace_event_registration_event_participant
            tableName: rg_workspace_event_registration
            columnNames: event_unique_id, participant_unique_id
