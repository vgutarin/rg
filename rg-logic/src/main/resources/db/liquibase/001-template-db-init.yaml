databaseChangeLog:
  - changeSet:
      id: 001-1
      author: vg
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - createTable:
            columns:
              - column:
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_template_entity
                  name: unique_id
                  type: BIGINT
              - column:
                  name: name
                  type: VARCHAR(255)
              - column:
                  name: description
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: DATETIME(8)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: DATETIME(8)
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: INT
                  constraints:
                    nullable: false
            tableName: template_entity

