#db
spring.liquibase.enabled=true
spring.liquibase.url=${spring.datasource.url}
spring.liquibase.user=${spring.datasource.username}
spring.liquibase.password=${spring.datasource.password}
spring.liquibase.change-log=classpath:liquibase-changelog.yml

spring.jpa.hibernate.ddl-auto=none

spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG

# Functional tests use the isolated development facade and synthetic credentials.
rg.secure-service.enabled=true
rg.secure-service.bot-token=synthetic-test-token
