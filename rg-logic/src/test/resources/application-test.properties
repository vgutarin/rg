#db
spring.liquibase.enabled=true
spring.liquibase.url=${spring.datasource.url}
spring.liquibase.user=${spring.datasource.username}
spring.liquibase.password=${spring.datasource.password}
spring.liquibase.change-log=classpath:liquibase-changelog.yml

spring.jpa.hibernate.ddl-auto=none

spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG

# Functional tests use the isolated development facade and synthetic credentials.
rg.dev-secure-service.enabled=true
rg.dev-secure-service.bot-token=synthetic-test-token


# Field encryption at rest. EncryptionService is a @Component, so every context scanning vg.rg needs a
# valid keyring or startup fails by design -- there is no "encryption disabled" mode. This key is
# deliberately a Base64 of readable ASCII so it can never be mistaken for a real secret.
rg.encryption.current-key-id=1
rg.encryption.keys.1=dGVzdC1zZWNyZXQta2V5LTEyMzQ1Njc4OTAxMjM0NTY=
